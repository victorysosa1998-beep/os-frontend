name: os_dating
description: OS — verification-first dating app
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  livekit_client: ^2.13.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2
  flutter_ringtone_player: ^4.0.0+4
  record: ^7.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/os_logo.svg
    - assets/icon/os_launcher.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/os_launcher.png
  min_sdk_android: 23
